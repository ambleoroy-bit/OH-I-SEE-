<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — OH I SEE</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8f9fa;
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
    }
    .reset-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .reset-container img {
      width: 60px;
      margin-bottom: 20px;
    }
    .reset-container h2 {
      margin: 0 0 10px;
      font-size: 24px;
      color: #111;
    }
    .reset-container p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .input-wrapper {
      position: relative;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .toggle-visibility {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #666;
    }
    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-bar {
      flex: 1;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      transition: 0.3s;
    }
    .strength-text {
      font-size: 11px;
      text-align: left;
      margin-top: 4px;
      color: #666;
      display: block;
    }
    .error-msg {
      color: #d32f2f;
      font-size: 13px;
      text-align: left;
      margin-bottom: 20px;
      display: none;
    }
    .success-screen {
      display: none;
    }
    .success-screen h2 {
      color: #2e7d32;
    }
  </style>
</head>
<body>

  <div class="reset-container" id="reset-form-container">
    <img src="/images/logo.png" alt="OH I SEE">
    <h2>Reset Password</h2>
    <p>Create a strong password for your account.</p>

    <div class="error-msg" id="error-message"></div>

    <div class="form-group">
      <label>New Password *</label>
      <div class="input-wrapper">
        <input type="password" id="new-password" placeholder="Enter new password">
        <button class="toggle-visibility" onclick="togglePassword('new-password', this)">👁️</button>
      </div>
      <div class="password-strength">
        <div class="strength-bar" id="str-1"></div>
        <div class="strength-bar" id="str-2"></div>
        <div class="strength-bar" id="str-3"></div>
        <div class="strength-bar" id="str-4"></div>
      </div>
      <span class="strength-text" id="strength-text">Minimum 8 chars, 1 uppercase, 1 number, 1 special</span>
    </div>

    <div class="form-group">
      <label>Confirm Password *</label>
      <div class="input-wrapper">
        <input type="password" id="confirm-password" placeholder="Re-enter password">
        <button class="toggle-visibility" onclick="togglePassword('confirm-password', this)">👁️</button>
      </div>
    </div>

    <button class="btn btn-primary" style="width: 100%; padding: 14px 0;" onclick="submitReset()" id="reset-btn">Reset Password</button>
  </div>

  <div class="reset-container success-screen" id="success-screen">
    <div style="font-size: 48px; margin-bottom: 20px;">✔</div>
    <h2>Password Updated Successfully</h2>
    <p>Your password has been changed securely.</p>
    <a href="login.html" class="btn btn-primary" style="display:inline-block; padding: 14px 30px; text-decoration:none;">Back to Login</a>
    <p style="margin-top:20px; font-size:12px; color:#999;">Redirecting in <span id="countdown">3</span>...</p>
  </div>

  <script src="../js/api/api-core.js"></script>
  <script src="../js/api/auth.js"></script>
  <script src="../js/components/notifications.js"></script>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    // Validate token on load
    window.addEventListener('DOMContentLoaded', async () => {
      if (!token) {
        showError('Reset link is invalid. No token provided.');
        document.getElementById('reset-btn').disabled = true;
        return;
      }
      try {
        await AuthAPI.verifyResetToken(token);
      } catch (err) {
        showError(err.message || 'Your reset link has expired or is invalid.');
        document.getElementById('reset-btn').disabled = true;
      }
    });

    function showError(msg) {
      const errEl = document.getElementById('error-message');
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // Password strength logic
    document.getElementById('new-password').addEventListener('input', function(e) {
      const val = e.target.value;
      let strength = 0;
      
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
      if (/\d/.test(val)) strength++;
      if (/[@$!%*?&]/.test(val)) strength++;

      const bars = [
        document.getElementById('str-1'),
        document.getElementById('str-2'),
        document.getElementById('str-3'),
        document.getElementById('str-4')
      ];
      
      const text = document.getElementById('strength-text');

      bars.forEach(b => b.style.background = '#eee');

      if (strength >= 1) bars[0].style.background = '#f44336';
      if (strength >= 2) bars[1].style.background = '#ff9800';
      if (strength >= 3) bars[2].style.background = '#ffeb3b';
      if (strength >= 4) bars[3].style.background = '#4caf50';

      if (strength === 0) text.textContent = 'Too Weak';
      else if (strength === 1 || strength === 2) text.textContent = 'Weak';
      else if (strength === 3) text.textContent = 'Good';
      else if (strength === 4) text.textContent = 'Strong';
    });

    async function submitReset() {
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('reset-btn');

      document.getElementById('error-message').style.display = 'none';

      if (!password || !confirmPassword) {
        showError('Please fill in both fields.');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      const passRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if (!passRegex.test(password)) {
        showError('Password does not meet security requirements.');
        return;
      }

      const origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await AuthAPI.resetPassword(token, password, confirmPassword);
        
        // Show success screen
        document.getElementById('reset-form-container').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
        
        let count = 3;
        const countEl = document.getElementById('countdown');
        const interval = setInterval(() => {
          count--;
          countEl.textContent = count;
          if (count <= 0) {
            clearInterval(interval);
            window.location.href = 'login.html';
          }
        }, 1000);

      } catch (err) {
        showError(err.message || 'Failed to update password.');
        btn.disabled = false;
        btn.textContent = origText;
      }
    }
  </script>
</body>
</html>
