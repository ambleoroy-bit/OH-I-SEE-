<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export — OH I SEE</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/project-workspace.css">
  <link rel="icon" href="/images/logo.png" type="image/png">
</head>
<body class="pw-body">
  <header class="pw-header"><div class="container pw-header-inner"><a href="index.html" class="pw-back">← OH I SEE</a><div><div class="pw-project-id" id="pw-header-id">—</div><div class="pw-project-name" id="pw-header-name">Loading…</div></div></div></header>
  <div class="pw-shell"><aside class="pw-sidebar" id="pw-nav"></aside><main class="pw-main"><div class="pw-topbar" id="pw-topbar"></div><div class="pw-content" id="pw-content"></div></main></div>
  <script src="../js/utils/helpers.js"></script><script src="../js/components/notifications.js"></script><script src="../js/api/api-core.js"></script><script src="../js/api/projects.js"></script><script src="../js/bim/api/bim.js"></script><script src="../js/bim/project-workspace.js"></script>
  <script>
    async function init() {
      const projectId = ProjectWorkspace.getProjectId();
      if (!projectId || !ProjectWorkspace.requireAuth(projectId)) return;
      const project = await ProjectWorkspace.loadProject(projectId);
      if (!project) return;
      document.getElementById('pw-header-id').textContent = project.project_id;
      document.getElementById('pw-header-name').textContent = project.project_name;
      ProjectWorkspace.renderNav('export', projectId);
      let status = 'none', model = null;
      try { const res = await BimAPI.getModel(projectId); status = res.data?.status || 'none'; model = res.data?.model; } catch (e) {}
      ProjectWorkspace.renderTopbar(project, 'Export', status);
      ProjectWorkspace.wireBimActions(projectId, init);
      document.getElementById('pw-content').innerHTML = `<div class="pw-stat-card">
        <div class="pw-stat-label">Export formats</div>
        <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
          <button type="button" class="pw-btn" id="export-json" ${model ? '' : 'disabled'}>Download BIM JSON</button>
          <button type="button" class="pw-btn" disabled title="Phase 15">Export IFC (coming soon)</button>
        </div>
        <p style="margin-top:16px;color:#666;font-size:12px;">IFC export will be available in Phase 15.</p>
      </div>`;
      document.getElementById('export-json')?.addEventListener('click', () => {
        if (!model) return;
        const blob = new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${project.project_id}-bim.json`;
        a.click();
      });
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
