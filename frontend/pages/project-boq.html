<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantities / BOQ — OH I SEE</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/project-workspace.css">
  <link rel="icon" href="/images/logo.png" type="image/png">
</head>
<body class="pw-body">
  <header class="pw-header">
    <div class="container pw-header-inner">
      <a href="index.html" class="pw-back">← OH I SEE</a>
      <div>
        <div class="pw-project-id" id="pw-header-id">—</div>
        <div class="pw-project-name" id="pw-header-name">Loading…</div>
      </div>
    </div>
  </header>
  <div class="pw-shell">
    <aside class="pw-sidebar" id="pw-nav"></aside>
    <main class="pw-main">
      <div class="pw-topbar" id="pw-topbar"></div>
      <div class="pw-content" id="pw-content"><div class="pw-loading">Loading quantities…</div></div>
    </main>
  </div>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/components/notifications.js"></script>
  <script src="../js/api/api-core.js"></script>
  <script src="../js/api/projects.js"></script>
  <script src="../js/bim/api/bim.js"></script>
  <script src="../js/bim/project-workspace.js"></script>
  <script>
    async function init() {
      const projectId = ProjectWorkspace.getProjectId();
      if (!projectId || !ProjectWorkspace.requireAuth(projectId)) return;
      const project = await ProjectWorkspace.loadProject(projectId);
      if (!project) {
        document.getElementById('pw-content').innerHTML = '<div class="pw-error">Project not found.</div>';
        return;
      }
      document.getElementById('pw-header-id').textContent = project.project_id;
      document.getElementById('pw-header-name').textContent = project.project_name;
      ProjectWorkspace.renderNav('boq', projectId);
      let bimData = { status: 'none' };
      let quantities = null;
      try {
        const res = await BimAPI.getModel(projectId);
        bimData = res.data;
        quantities = bimData?.quantities;
        if (!quantities && bimData?.model) {
          const qRes = await BimAPI.getQuantities(projectId);
          quantities = qRes.data;
        }
      } catch (e) {}
      ProjectWorkspace.renderTopbar(project, 'Quantities / BOQ', bimData?.status || 'none');
      ProjectWorkspace.wireBimActions(projectId, init);
      const lines = quantities?.lines || [];
      document.getElementById('pw-content').innerHTML = lines.length ? `
        <div class="pw-stat-card">
          <div class="pw-stat-label">BIM-derived quantity takeoff</div>
          <table class="pw-table" style="margin-top:16px;">
            <thead><tr><th>Description</th><th>Type</th><th>Qty</th><th>Unit</th></tr></thead>
            <tbody>${lines.map((l) => `
              <tr>
                <td>${l.description || l.name}</td>
                <td>${l.elementType || '—'}</td>
                <td>${l.value}</td>
                <td>${l.unit}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : `
        <div class="pw-stat-card"><p style="color:#888;">Generate a BIM model first to populate quantities from building elements.</p></div>`;
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
