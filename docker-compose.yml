# OH I SEE — Local development & integration testing
# Usage: cp .env.example .env  →  docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${OHISEE_API_IMAGE:-ohisee-api:local}
    container_name: ohisee-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "3001:3001"
    volumes:
      - design3d-data:/app/.data/design3d
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: ${OHISEE_FRONTEND_IMAGE:-ohisee-frontend:local}
    container_name: ohisee-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: backend:3001
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      OHISEE_API_BASE: /api
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: enable with  docker compose --profile design3d up --build
  design3d-worker:
    profiles: ["design3d"]
    build:
      context: .
      dockerfile: docker/design3d-worker.Dockerfile
    image: ${OHISEE_WORKER_IMAGE:-ohisee-design3d-worker:local}
    container_name: ohisee-design3d-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DESIGN3D_WORKER_MODE: headless
      DESIGN3D_STORAGE: ${DESIGN3D_STORAGE:-local}
      DESIGN3D_STORAGE_ROOT: /app/.data/design3d
    volumes:
      - design3d-data:/app/.data/design3d
    depends_on:
      backend:
        condition: service_healthy

volumes:
  design3d-data:
