apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohisee-frontend
  labels:
    app.kubernetes.io/name: ohisee-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ohisee-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ohisee-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: ohisee-frontend
      containers:
        - name: frontend
          image: ohisee-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: ohisee-api:3001
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ohisee-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: ohisee-secrets
                  key: SUPABASE_ANON_KEY
            - name: OHISEE_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: ohisee-config
                  key: OHISEE_API_BASE
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
