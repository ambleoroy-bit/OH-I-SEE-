# Copy to secrets.yaml and fill values — DO NOT commit secrets.yaml
# kubectl apply -f k8s/base/secrets.yaml -n ohisee
apiVersion: v1
kind: Secret
metadata:
  name: ohisee-secrets
  labels:
    app.kubernetes.io/part-of: ohisee
type: Opaque
stringData:
  JWT_SECRET: replace-me
  SUPABASE_URL: https://your-project.supabase.co
  SUPABASE_ANON_KEY: your-anon-key
  SUPABASE_SERVICE_ROLE_KEY: your-service-role-key
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""
