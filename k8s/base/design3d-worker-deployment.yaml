apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohisee-design3d-worker
  labels:
    app.kubernetes.io/name: ohisee-design3d-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ohisee-design3d-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ohisee-design3d-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ohisee-design3d-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ohisee-design3d-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ohisee-config
            - secretRef:
                name: ohisee-secrets
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
