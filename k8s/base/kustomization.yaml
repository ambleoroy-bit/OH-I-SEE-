apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ohisee

labels:
  - pairs:
      app.kubernetes.io/part-of: ohisee
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - design3d-worker-deployment.yaml
  - ingress.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml

# secrets.yaml is NOT included — apply separately from secrets.example.yaml
